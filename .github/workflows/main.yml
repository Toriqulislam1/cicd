name: Static Site CI/CD

on:
  push:
    branches:
      - main  # Trigger on main branch push

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Optional: Run basic HTML validation
      - name: Install HTML Validator
        run: sudo apt-get install tidy -y

      - name: Validate HTML
        run: tidy -errors -q index.html || true

      # 3. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .








































































